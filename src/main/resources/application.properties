spring.application.name=cobro

# Variables locales opcionales (.env en la carpeta del backend; no se versiona)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8081}

# H2 base de datos local persistente en archivo
spring.datasource.url=jdbc:h2:file:./data/cobro_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS - origen permitido (local por defecto)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Datos de demostración (cartera de ejemplo para la IA). Se cargan solo si no hay cobradores.
app.seed.enabled=${APP_SEED_ENABLED:true}

# Sesiones (JWT). Sin JWT_SECRET se genera una clave y se guarda en la base de datos.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480

# Usuario de demostración (admin@cobro.com). Solo desarrollo; en prod no se crea salvo que se defina.
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Admin123*}

# Machine Learning: reentrenamiento y seguimiento diario (por defecto a las 03:00)
app.ml.reentrenamiento.cron=${ML_CRON:0 0 3 * * *}

# Keep-alive: evita que Render suspenda el servicio gratuito por inactividad.
# RENDER_EXTERNAL_URL lo define Render automáticamente; en local queda vacío y no se ejecuta.
app.keepalive.habilitado=${KEEPALIVE_ENABLED:true}
app.keepalive.url=${KEEPALIVE_URL:${RENDER_EXTERNAL_URL:}}
app.keepalive.intervalo-ms=${KEEPALIVE_INTERVAL_MS:600000}

# Workers: hilos que procesan la cola de tareas en segundo plano
app.workers.habilitado=${WORKERS_ENABLED:true}
app.workers.hilos=${WORKERS_THREADS:2}
app.workers.programador.habilitado=${WORKERS_SCHEDULER_ENABLED:true}
app.workers.mora.cron=${WORKERS_MORA_CRON:0 5 * * * *}

# gRPC: servidor embebido en un puerto propio (los navegadores usan la API REST)
app.grpc.habilitado=${GRPC_ENABLED:true}
app.grpc.puerto=${GRPC_PORT:9090}
app.grpc.hilos=${GRPC_THREADS:4}

# Groq (asistente de IA con modelos de lenguaje). Sin GROQ_API_KEY el asistente responde con texto local.
app.groq.api-key=${GROQ_API_KEY:}
app.groq.modelo=${GROQ_MODEL:llama-3.3-70b-versatile}
app.groq.url-base=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.groq.timeout=${GROQ_TIMEOUT:30s}
app.groq.max-tokens=${GROQ_MAX_TOKENS:700}
app.groq.temperatura=${GROQ_TEMPERATURE:0.3}
app.groq.limite-por-minuto=${GROQ_RATE_LIMIT:10}
