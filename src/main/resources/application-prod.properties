server.port=${PORT:8080}

# PostgreSQL - Render (credenciales inyectadas por variables de entorno o .env)
# DATABASE_URL puede ser la "Internal Database URL" de Render (postgresql://...) o una URL JDBC;
# ver RenderDatabaseUrlPostProcessor.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Console deshabilitada en producción
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Datos de demostración
app.seed.enabled=${APP_SEED_ENABLED:false}
