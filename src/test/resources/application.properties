spring.application.name=cobro-test
spring.datasource.url=jdbc:h2:mem:cobro_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
allowed.origins=http://localhost:4200
app.seed.enabled=false
app.ml.reentrenamiento.habilitado=false
app.keepalive.habilitado=false
app.workers.programador.habilitado=false
app.grpc.puerto=0
