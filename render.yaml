# Blueprint de Render para el backend (repo Prestamos_System_Back).
# Las credenciales (DATABASE_URL) se ingresan en el panel: sync: false evita guardarlas en git.
services:
  - type: web
    name: cobro-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://prestamos-system-front.vercel.app,https://*.vercel.app,http://localhost:4200
      - key: APP_SEED_ENABLED
        value: "false"
      # Clave de admin@cobro.com: se crea al arrancar si no hay administradores (no se guarda en git).
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      # Keep-alive: el servicio se llama a sí mismo cada 10 min por RENDER_EXTERNAL_URL
      # (variable que Render define sola) para no suspenderse por inactividad.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: WORKERS_THREADS
        value: "2"
      # gRPC escucha en 9090 dentro del contenedor (Render solo publica el puerto HTTP;
      # para usar gRPC desde fuera se necesita un servicio privado o un proxy).
      - key: GRPC_PORT
        value: "9090"
      # Asistente de IA: pegue la clave de Groq en el panel de Render (no se guarda en git).
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
